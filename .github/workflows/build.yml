name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir www && cp index.html ./*.js www/
      - run: npm install
      - run: npx cap add android
      - name: Icono
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx --yes @capacitor/assets generate --android
      - name: Permisos
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n<application#' android/app/src/main/AndroidManifest.xml
      - name: Version y firma fija
        run: |
          VER=$(node -p "require('./package.json').version")
          VC=$(( $(date +%s) / 60 ))
          BLD=$(date -u +%y%m%d.%H%M)
          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          sed -i "s/__BUILD__/$BLD/g; s/__VER__/$VER/g" www/index.html
          mkdir -p ~/.android
          cp dcdigicheck-debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DigiCheckDC-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
