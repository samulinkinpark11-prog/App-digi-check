let img,sel,drag;const cv=$('cv'),cx=cv.getContext('2d');
function openCrop(f){img=new Image();img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height));cv.width=img.width*k;cv.height=img.height*k;sel={x:cv.width*.05,y:cv.height*.05,w:cv.width*.9,h:cv.height*.9};draw();$('modal').style.display='flex'};img.src=URL.createObjectURL(f)}

const T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(d){let c=-1;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(files){const loc=[],cen=[],en=new TextEncoder();let off=0;for(const f of files){const n=en.encode(f.name),c=crc(f.data),s=f.data.length;
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);loc.push(new Uint8Array(h.buffer),n,f.data);
const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint32(16,c,true);d.setUint32(20,s,true);d.setUint32(24,s,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);cen.push(new Uint8Array(d.buffer),n);off+=30+n.length+s}
const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...loc,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function b64(u){let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)}

function showV(){const ex=V.ex,a=ex?exs(V.i)||[]:P[V.i];if(!a.length)return closeV();V.j=(V.j+a.length)%a.length;document.querySelectorAll('#vw .vf .own').forEach(b=>b.style.display=ex?'none':'');

$('vi').src=a[V.j].url;resetZ();$('vt').textContent=(V.i+1)+String.fromCharCode(97+V.j)+' · '+ITEMS[V.i].split(' (')[0]+(a[V.j].q&&a[V.j].q.length?' ⚠ '+a[V.j].q.join(', '):'')+' · pellizca para ampliar';$('vw').style.display='flex'}

let sy=0,pinch=null,pan=null,mv=false,lastTap=0,Z={s:1,x:0,y:0};
function applyZ(){$('vi').style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
function resetZ(){Z={s:1,x:0,y:0};applyZ()}
function clampZ(){if(Z.s<=1){Z.x=Z.y=0;return}const r=$('vc').getBoundingClientRect(),im=$('vi'),mx=Math.max(0,(im.clientWidth*Z.s-r.width)/2),my=Math.max(0,(im.clientHeight*Z.s-r.height)/2);Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y))}
function zoomAt(px,py,ns){const r=$('vc').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;ns=Math.max(1,Math.min(6,ns));const k=ns/Z.s;Z.x=(px-cx)-((px-cx)-Z.x)*k;Z.y=(py-cy)-((py-cy)-Z.y)*k;Z.s=ns;clampZ();applyZ()}
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
$('vc').addEventListener('touchstart',e=>{if(e.touches.length==2){pinch={d:dist(e.touches),s:Z.s};pan=null}else if(e.touches.length==1){const t=e.touches[0];pan={x:t.clientX,y:t.clientY,zx:Z.x,zy:Z.y};sx=t.clientX;sy=t.clientY;mv=false}},{passive:true});
$('vc').addEventListener('touchmove',e=>{e.preventDefault();const T=e.touches;if(T.length==2&&pinch){zoomAt((T[0].clientX+T[1].clientX)/2,(T[0].clientY+T[1].clientY)/2,pinch.s*dist(T)/pinch.d)}else if(T.length==1&&pan){if(Math.abs(T[0].clientX-sx)>8||Math.abs(T[0].clientY-sy)>8)mv=true;if(Z.s>1){Z.x=pan.zx+T[0].clientX-pan.x;Z.y=pan.zy+T[0].clientY-pan.y;clampZ();applyZ()}}},{passive:false});
$('vc').addEventListener('touchend',e=>{if(pinch&&e.touches.length<2){pinch=null;pan=null;if(Z.s<1.03)resetZ();return}if(e.touches.length||!pan)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;pan=null;
if(Z.s==1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){stepV(dx<0?1:-1);return}
if(!mv){const n=Date.now();if(n-lastTap<320){lastTap=0;if(Z.s>1.05)resetZ();else zoomAt(t.clientX,t.clientY,2.5)}else lastTap=n}});
let DR=null,active=false;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('dcd',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(v){try{const d=await idb(),t=d.transaction('d','readwrite'),st=t.objectStore('d');v===null?st.delete('cur'):st.put(v,'cur');await new Promise(r=>{t.oncomplete=t.onerror=t.onabort=()=>r()})}catch(e){}}
async function dbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('d').objectStore('d').get('cur');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}

document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pTimer);doPersist()}});
async function resume(){S.job=DR.job;configure(DR.job.type);NA=ITEMS.map((_,i)=>!!(DR.NA&&DR.NA[i]));ANS=ITEMS.map((_,i)=>(DR.ANS&&DR.ANS[i])||null);P=ITEMS.map((_,i)=>(DR.P[i]||[]).map(p=>({blob:p.blob,time:p.time,q:p.q,th:p.th,url:URL.createObjectURL(p.blob)})));active=true;await Promise.all(P.flat().filter(p=>!p.th).map(p=>analyze(p,true)));list()}
async function discard(){if(await C('¿Descartar el borrador y sus fotos?','Descartar','Cancelar')){await dbSet(null);DR=null;home()}}
async function exitL(){clearTimeout(pTimer);await doPersist();active=false;DR=await dbGet();home()}
function quality(c,sz){const w=Math.min(960,c.width),h=Math.max(1,Math.round(c.height*w/c.width)),t=document.createElement('canvas');t.width=w;t.height=h;const k=t.getContext('2d',{willReadFrequently:true});k.drawImage(c,0,0,w,h);const d=k.getImageData(0,0,w,h).data,N=w*h,g=new Float32Array(N);let m=0,hi=0,lo=0;
for(let i=0;i<N;i++){const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];g[i]=v;m+=v;if(v>245)hi++;if(v<25)lo++}m/=N;
const tw=Math.floor((w-2)/4),th=Math.floor((h-2)/4);let vr=1e9;
if(tw>=3&&th>=3){const tv=[];for(let ty=0;ty<4;ty++)for(let tx=0;tx<4;tx++){let a=0,a2=0,n=0;for(let y=1+ty*th;y<1+(ty+1)*th;y++)for(let x=1+tx*tw;x<1+(tx+1)*tw;x++){const i=y*w+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];a+=l;a2+=l*l;n++}tv.push(a2/n-(a/n)**2)}tv.sort((p,q)=>p-q);vr=tv[13]}
const is=[];if(vr<35*SENS)is.push('borrosa o desenfocada');else if(vr<90*SENS)is.push('poco nítida');
if(m<50||lo/N>.6)is.push('muy oscura');if(m>210||hi/N>.3)is.push('sobreexpuesta (demasiada luz)');if(sz!==undefined?sz<150000:c.width*c.height<500000)is.push('de baja resolución');return{issues:is,vr,m}}
let ST=null,IC=null,CI=0,busy=false,ED=null;
function grab(){const v=$('cv2'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return c}
function thumb(c){const t=document.createElement('canvas');t.width=160;t.height=Math.max(1,Math.round(c.height*160/c.width));t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function analyze(p,keep){try{const bm=await createImageBitmap(p.blob,{resizeWidth:960,resizeQuality:'medium'});if(!keep)p.q=quality(bm,p.blob.size).issues;if(!p.th){const c=document.createElement('canvas');c.width=160;c.height=Math.max(1,Math.round(bm.height*160/bm.width));c.getContext('2d').drawImage(bm,0,0,c.width,c.height);p.th=c.toDataURL('image/jpeg',.7)}if(bm.close)bm.close()}catch(e){}}

async function openCam(i){CI=i;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;

const tr=ST.getVideoTracks()[0];TR=tr;TC=!!(tr.getCapabilities&&tr.getCapabilities().torch);$('fl').style.display=TC?'':'none';IC=window.ImageCapture?new ImageCapture(tr):null;MAXP=undefined;if(IC)IC.getPhotoCapabilities().then(c=>{if(c.imageWidth&&c.imageHeight)MAXP={imageWidth:c.imageWidth.max,imageHeight:c.imageHeight.max}}).catch(()=>{});const v=$('cv2');v.srcObject=ST;await v.play().catch(()=>{});
$('ct2').textContent=(i+1)+'. '+ITEMS[i].split(' (')[0];camUpd();$('exb').style.display=exs(i)?'':'none';$('cm').style.display='block';applyFlash()}catch(e){camStop();$('f').click()}}

let TR=null,TC=false,FL='auto',FT=null,TORCHON=false;

function autoTorch(){if(!ST||TORCHON)return;const v=$('cv2');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=32;c.height=24;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,32,24);const d=x.getImageData(0,0,32,24).data;let m=0;for(let i=0;i<d.length;i+=4)m+=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(m/768<55)setTorch(true)}
