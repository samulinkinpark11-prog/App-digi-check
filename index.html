const GUIDE=[['Crea tu trabajo','Elige el tipo de trabajo, escribe la cabecera y los códigos DCIM y provincia, y pulsa «Abrir checklist».'],['Haz las fotos','Cada punto tiene su cámara y puedes hacer varias fotos seguidas. Pulsa una miniatura para ampliarla, recortarla o borrarla. Usa «No aplica» si el punto no corresponde.'],['Notas y marca de agua','«Nota» añade un comentario a un punto, que sale en el reportaje. Las fotos llevan el logo, las coordenadas y la dirección si lo tienes activado en Ajustes.'],['Valida y genera','Al validar se guardan las fotos en Documentos/Almacenamiento Fotos. Después genera el PowerPoint y el ZIP con todo para extraerlo donde corresponda.'],['No pierdas nada','Si sales, el trabajo queda como borrador. Desde el borrador puedes exportarlo a un archivo por si cambias de móvil.']];

function guide(n){GI=n||0;let g=$('gd');if(!g){g=document.createElement('div');g.id='gd';g.style.cssText='position:fixed;inset:0;background:#000d;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px';document.body.appendChild(g)}
const s=GUIDE[GI],last=GI===GUIDE.length-1;g.innerHTML='<div class="dc"><p style="font-size:12px;letter-spacing:.1em;color:var(--mu);margin:0">GUÍA RÁPIDA · '+(GI+1)+'/'+GUIDE.length+'</p><h3 style="margin:8px 0">'+s[0]+'</h3><p>'+s[1]+'</p><div class="row"><button class="s" onclick="guideEnd()">Saltar</button><button onclick="'+(last?'guideEnd()':'guide('+(GI+1)+')')+'">'+(last?'Empezar':'Siguiente')+'</button></div></div>';g.style.display='flex'}

async function expDraft(){if(active)await doPersist();const d=await dbGet();if(!d)return alert('No hay ningún borrador');
const z=new JSZip();z.file('borrador.json',JSON.stringify({app:'DCDIGICheck',ver:d.ver||2,job:d.job,NA:d.NA,ANS:d.ANS,N:d.N||[],P:d.P.map(a=>a.map(p=>({time:p.time,q:p.q,ann:p.ann,geo:p.geo,addr:p.addr,stamped:p.stamped})))}));
d.P.forEach((a,i)=>a.forEach((p,j)=>z.file('fotos/'+i+'_'+j+'.jpg',p.blob)));if(d.plan&&d.plan.blob)z.file('plano.jpg',d.plan.blob);
const blob=await z.generateAsync({type:'blob',compression:'STORE'}),n=new Date(),p2=x=>String(x).padStart(2,'0'),nm=('BORRADOR_'+d.job.site+'_'+d.job.type+'_'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'.zip').replace(/[\\/:*?"<>|]/g,'');
const FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
