function pick(el,t){S.job.type=t;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));$('ow').style.display=t=='Otros'?'block':'none';if(t=='Otros')$('o').focus()}

if(!S.user)return app.innerHTML=HERO+`<div class="card"><b>Registro de empleado</b><label>Nombre y apellidos</label><input id="n"><label>ID de empleado</label><input id="e"><button class="w" onclick="reg()">Entrar</button></div>`;
if(!S.path)return app.innerHTML=HERO+`<div class="card"><b>Ubicación de «Almacenamiento Fotos»</b><p class="hint">Escribe la carpeta dentro de Documentos del móvil donde se creará «Almacenamiento Fotos». Se puede cambiar luego en Ajustes.</p><input id="p" placeholder="p. ej. DIGI"><button class="w" onclick="setPath()">Guardar</button></div>`;
const sel=TYPES.includes(S.job.type)?S.job.type:'Otros',oth=TYPES.includes(S.job.type)?'':S.job.type,ch=t=>`<button class="chip ${t==sel?'on':''}" onclick="pick(this,'${t}')">${t}</button>`;
app.innerHTML=`<div class="hero"><svg width="84" height="84"><use href="#lg"/></svg><h2>Hola, ${esc(S.user.name.split(' ')[0])}</h2><p>¿Qué trabajo vas a documentar hoy?</p></div>`+(DR?`<div class="card ok"><b>Borrador en curso</b><p class="hint">${esc(DR.job.type)} · ${esc(DR.job.site)} · ${DR.P.reduce((n,a)=>n+a.length,0)} fotos</p><div class="row"><button onclick="resume()">Retomar</button><button class="s" onclick="discard()">Descartar</button></div></div>`:'')+`<div class="card"><label style="margin-top:0">Tipo de trabajo</label><div class="mp">${TYPES.slice(0,4).map(ch).join('')}</div><div class="chips" style="margin-top:8px">${TYPES.slice(4,-1).map(ch).join('')}</div><div class="chips" style="margin-top:24px">${ch('Otros')}</div><div id="ow" style="display:${sel=='Otros'?'block':'none'}"><input id="o" maxlength="40" value="${esc(oth)}" placeholder="Describe el trabajo (p. ej. Revisión de baterías)" style="margin-top:10px"></div><label>Cabecera o Data Center</label><input id="s" value="${esc(S.job.site)}" placeholder="p. ej. MONTEQUINTO" autocapitalize="characters"><button class="w" onclick="start()">Abrir checklist ${ic('right')}</button><button class="w s" onclick="settings()">Ajustes</button></div>`}
function reg(){const n=$('n').value.trim(),e=$('e').value.trim();if(!n||!e)return alert('Completa los datos');S.user={name:n,id:e};save();home()}
function setPath(){const p=$('p').value.trim();if(!p)return alert('Indica una ruta');S.path=p;save();home()}
function settings(){app.innerHTML=`<div class="card"><b>Ajustes</b><label>Carpeta base</label><input id="p" value="${esc(S.path)}"><button class="w" onclick="setPath()">Guardar</button><button class="w s" onclick="home()">Volver</button></div>`}
async function start(){let t=TYPES.includes(S.job.type)?S.job.type:'Otros';const s=$('s').value.trim().toUpperCase().replace(/[\\/:*?"<>|]/g,'');if(!s)return alert('Indica la cabecera o data center');if(t=='Otros'){t=($('o').value||'').trim().replace(/[\\/:*?"<>|]/g,'');if(!t)return alert('Escribe el tipo de trabajo');}if(DR&&!await C('Hay un borrador de '+DR.job.type+' · '+DR.job.site+'. Si empiezas uno nuevo se borrará.','Continuar','Cancelar'))return;S.job={type:t,site:s};DR=null;dbSet(null);active=true;reset();list()}
function done(i){return NA[i]||P[i].length>0}
const GR=[['Emplazamiento',[0,1]],['Alimentación eléctrica',[2,3,4,5]],['Rack y cableado',[6,7,8]],['Equipos y red',[9,10,11,12,13,14]]];
function card(i){return `<div class="card ${done(i)?'ok':''} ${NA[i]?'na':''}"><div class="ct"><span class="num">${done(i)?ic('check',18):i+1}</span><b>${ITEMS[i]}</b><span class="pill">${NA[i]?'No aplica':P[i].length?P[i].length+' fotos':'Pendiente'}</span></div><div class="row">${P[i].map((p,j)=>`<div class="th"><img src="${p.th||p.url}" onclick="view(${i},${j})"><b>${i+1}${String.fromCharCode(97+j)}</b>${p.q&&p.q.length?`<s>${ic('warn',13)}</s>`:''}<i onclick="del(${i},${j})">${ic('close',13)}</i></div>`).join('')}</div><div class="row"><button ${NA[i]?'disabled':''} onclick="cam(${i})">${ic('camera')} Cámara</button><button class="s" onclick="toggleNA(${i})">${ic('ban')} ${NA[i]?'Quitar':'No aplica'}</button></div></div>`}
function list(){persist();$('bar').hidden=false;const d=ITEMS.filter((_,i)=>done(i)).length,f=d/15;$('fill').style.width=f*100+'%';$('fill').style.background=`hsl(${120*f},80%,45%)`;$('cnt').style.display='block';$('cnt').textContent=d+'/15';
app.innerHTML=`<div class="hint" style="margin:2px 4px"><b style="color:var(--tx)">${esc(S.job.type)}</b> · ${esc(S.job.site)}</div>`+GR.map(([n,ix])=>`<div class="sec">${n}<span>${ix.filter(k=>done(k)).length}/${ix.length}</span></div>`+ix.map(card).join('')).join('')+`<input type="file" id="f" accept="image/*" multiple hidden>`;
$('fb').style.display='flex';$('fb').innerHTML=`<button class="s" onclick="exitL()">${ic('left')} Salir</button><button onclick="validate()" style="${d==15?'':'filter:saturate(.45)'}">${ic('check')} Validar · ${d}/15</button>`;
$('f').onchange=async e=>{for(const fl of e.target.files)addBlob(cur,fl);e.target.value='';list();runAQ().then(refresh)}}
function success(nf,nn,folder,where,base){$('bar').hidden=true;$('fb').style.display='none';$('cnt').style.display='none';app.innerHTML=`<div class="okscreen"><div class="big">${ic('check',48)}</div><h2>Checklist validado</h2><p class="hint">${esc(folder)}</p><div class="stats"><div><b>${nf}</b><span>fotos</span></div><div><b>${nn}</b><span>no aplica</span></div><div><b>15/15</b><span>puntos</span></div></div><p class="hint">Guardado en ${esc(where)}<br>${esc(base)}</p><button class="w" onclick="home()">Volver al inicio</button></div>`}
function cam(i){cur=i;openCam(i)}
function toggleNA(i){NA[i]=!NA[i];list()}
function del(i,j){P[i].splice(j,1);list()}
let img,sel,drag;const cv=$('cv'),cx=cv.getContext('2d');
function openCrop(f){img=new Image();img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height));cv.width=img.width*k;cv.height=img.height*k;sel={x:cv.width*.05,y:cv.height*.05,w:cv.width*.9,h:cv.height*.9};draw();$('modal').style.display='flex'};img.src=URL.createObjectURL(f)}
function draw(){cx.clearRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);cx.fillStyle='#0008';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,sel.x*img.width/cv.width,sel.y*img.height/cv.height,sel.w*img.width/cv.width,sel.h*img.height/cv.height,sel.x,sel.y,sel.w,sel.h);cx.strokeStyle='#0f0';cx.lineWidth=3;cx.strokeRect(sel.x,sel.y,sel.w,sel.h)}
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
cv.onpointerdown=e=>{drag=pt(e);cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const p=pt(e);sel={x:Math.max(0,Math.min(drag.x,p.x)),y:Math.max(0,Math.min(drag.y,p.y)),w:Math.min(cv.width,Math.abs(p.x-drag.x)),h:Math.min(cv.height,Math.abs(p.y-drag.y))};draw()};
cv.onpointerup=()=>drag=null;
function cropCancel(){$('modal').style.display='none';if(ED){const e=ED;ED=null;V={i:e.i,j:e.j,z:0};showV()}}
function cropOk(){if(sel.w<10||sel.h<10)return alert('Selecciona una zona mayor');const sx=img.width/cv.width,sy=img.height/cv.height,o=document.createElement('canvas');o.width=sel.w*sx;o.height=sel.h*sy;o.getContext('2d').drawImage(img,sel.x*sx,sel.y*sy,o.width,o.height,0,0,o.width,o.height);
const q=quality(o).issues;o.toBlob(b=>{const E=ED;ED=null;cropCancel();if(E){const p=P[E.i][E.j];p.blob=b;p.url=URL.createObjectURL(b);p.q=q;p.th=null;analyze(p,true);V={i:E.i,j:E.j,z:0};showV();persist();return}list()},'image/jpeg',.92)}
async function validate(){const miss=ITEMS.map((_,i)=>i+1).filter(i=>!done(i-1));
if(miss.length)return alert('Faltan por revisar los puntos: '+miss.join(', '));
if(!P.some(a=>a.length))return alert('Debes subir al menos una foto.');
if(await C('¿Quieres revisar el checklist antes de validar?','Revisar','Validar ya'))return;
final()}
const T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(d){let c=-1;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(files){const loc=[],cen=[],en=new TextEncoder();let off=0;for(const f of files){const n=en.encode(f.name),c=crc(f.data),s=f.data.length;
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);loc.push(new Uint8Array(h.buffer),n,f.data);
const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint32(16,c,true);d.setUint32(20,s,true);d.setUint32(24,s,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);cen.push(new Uint8Array(d.buffer),n);off+=30+n.length+s}
const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...loc,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function b64(u){let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)}
async function final(){const now=new Date(),p2=n=>String(n).padStart(2,'0'),ymd=''+now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate());
const folder=`${ymd}_${S.job.site} ${S.job.type}`,base=S.path+'/Almacenamiento Fotos/'+folder+'/',en=new TextEncoder(),files=[],log=[];
for(let i=0;i<15;i++){if(NA[i])log.push(`${i+1}: No aplica`);for(let j=0;j<P[i].length;j++){const nm=`${i+1}${String.fromCharCode(97+j)}.jpg`;files.push({name:base+nm,data:new Uint8Array(await P[i][j].blob.arrayBuffer())});log.push(`${nm} | ${S.user.name} (${S.user.id}) | ${P[i][j].time} | ${S.job.site}`)}}
files.push({name:base+'registro.txt',data:en.encode(log.join('\n'))});
let where='ZIP descargado';const FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
if(FS){try{await FS.requestPermissions()}catch(e){}
const w=async d=>{for(const f of files)await FS.writeFile({path:f.name,directory:d,data:await b64(f.data),recursive:true})};
try{await w('DOCUMENTS');where='Documentos'}catch(e){try{await w('EXTERNAL');where='Android/data/…/files'}catch(e2){return alert('Error al guardar: '+(e2.message||e2))}}}
else{const a=document.createElement('a');a.href=URL.createObjectURL(zip(files));a.download=folder+'.zip';document.body.appendChild(a);a.click();a.remove()}
const nf=files.length-1,nn=NA.filter(x=>x).length;active=false;DR=null;await dbSet(null);reset();success(nf,nn,folder,where,base)}
let V=null,sx=0;
function view(i,j){V={i,j,z:0};showV()}
function showV(){const a=P[V.i];if(!a.length)return closeV();V.j=(V.j+a.length)%a.length;$('vi').src=a[V.j].url;$('vi').className=V.z?'z':'';$('vt').textContent=(V.i+1)+String.fromCharCode(97+V.j)+' · '+ITEMS[V.i].split(' (')[0]+(a[V.j].q&&a[V.j].q.length?' ⚠ '+a[V.j].q.join(', '):'')+' — toca para ampliar';$('vw').style.display='flex'}
function closeV(){$('vw').style.display='none';list()}
function stepV(d){V.j+=d;V.z=0;showV()}
function zoomV(){V.z=!V.z;showV()}
async function delV(){if(await C('¿Borrar esta foto?','Borrar','Cancelar')){P[V.i].splice(V.j,1);V.z=0;showV()}}
$('vc').addEventListener('touchstart',e=>sx=e.touches[0].clientX);
$('vc').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(!V.z&&Math.abs(d)>60)stepV(d<0?1:-1)});
let DR=null,active=false;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('dcd',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(v){try{const d=await idb(),st=d.transaction('d','readwrite').objectStore('d');v===null?st.delete('cur'):st.put(v,'cur')}catch(e){}}
async function dbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('d').objectStore('d').get('cur');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
let pTimer=null;function persist(){clearTimeout(pTimer);pTimer=setTimeout(doPersist,1500)}
function doPersist(){if(!active)return;if(!P.some(a=>a.length)&&!NA.some(x=>x))return void dbSet(null);dbSet({job:S.job,NA:NA.slice(),P:P.map(a=>a.filter(p=>p.blob).map(p=>({blob:p.blob,time:p.time,q:p.q,th:p.th})))})}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(pTimer);doPersist()}});
async function resume(){S.job=DR.job;NA=DR.NA;P=DR.P.map(a=>a.map(p=>({blob:p.blob,time:p.time,q:p.q,th:p.th,url:URL.createObjectURL(p.blob)})));active=true;await Promise.all(P.flat().filter(p=>!p.th).map(p=>analyze(p,true)));list()}
async function discard(){if(await C('¿Descartar el borrador y sus fotos?','Descartar','Cancelar')){await dbSet(null);DR=null;home()}}
async function exitL(){active=false;DR=await dbGet();home()}
function quality(c,sz){const w=256,h=Math.max(1,Math.round(c.height*w/c.width)),t=document.createElement('canvas');t.width=w;t.height=h;const k=t.getContext('2d');k.drawImage(c,0,0,w,h);const d=k.getImageData(0,0,w,h).data,N=w*h,g=new Float32Array(N);let m=0,hi=0,lo=0;
for(let i=0;i<N;i++){const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];g[i]=v;m+=v;if(v>245)hi++;if(v<25)lo++}m/=N;
let s=0,s2=0,n=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];s+=l;s2+=l*l;n++}
const vr=s2/n-(s/n)**2,is=[];if(vr<40)is.push('borrosa o desenfocada');if(m<50||lo/N>.6)is.push('muy oscura');if(m>210||hi/N>.3)is.push('sobreexpuesta (demasiada luz)');if(sz!==undefined?sz<150000:c.width*c.height<500000)is.push('de baja resolución');return{issues:is,vr,m}}
let ST=null,IC=null,CI=0,busy=false,ED=null;
function grab(){const v=$('cv2'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return c}
function thumb(c){const t=document.createElement('canvas');t.width=160;t.height=Math.max(1,Math.round(c.height*160/c.width));t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.7)}
async function analyze(p,keep){try{const bm=await createImageBitmap(p.blob,{resizeWidth:256,resizeQuality:'low'});if(!keep)p.q=quality(bm,p.blob.size).issues;if(!p.th){const c=document.createElement('canvas');c.width=160;c.height=Math.max(1,Math.round(bm.height*160/bm.width));c.getContext('2d').drawImage(bm,0,0,c.width,c.height);p.th=c.toDataURL('image/jpeg',.7)}if(bm.close)bm.close()}catch(e){}}
let MAXP,pend=0;const AQ=[];
function addBlob(i,b){const p={blob:b,url:URL.createObjectURL(b),time:new Date().toISOString(),q:[],th:null};P[i].push(p);NA[i]=false;AQ.push(p);return p}
async function runAQ(){while(AQ.length)await analyze(AQ.shift(),false)}
function refresh(){if($('fb').style.display==='flex'&&$('vw').style.display!=='flex'&&$('cm').style.display!=='block'&&$('modal').style.display!=='flex')list()}
function small(c){const t=document.createElement('canvas');t.width=256;t.height=Math.max(1,Math.round(c.height*256/c.width));t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t}
async function openCam(i){CI=i;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
ST=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440},frameRate:{ideal:30}},audio:false});
const tr=ST.getVideoTracks()[0];IC=window.ImageCapture?new ImageCapture(tr):null;MAXP=undefined;if(IC)IC.getPhotoCapabilities().then(c=>{if(c.imageWidth&&c.imageHeight)MAXP={imageWidth:c.imageWidth.max,imageHeight:c.imageHeight.max}}).catch(()=>{});const v=$('cv2');v.srcObject=ST;await v.play().catch(()=>{});
$('ct2').textContent=(i+1)+'. '+ITEMS[i].split(' (')[0];camUpd();$('cm').style.display='block'}catch(e){camStop();$('f').click()}}
function camStop(){if(ST)ST.getTracks().forEach(t=>t.stop());ST=null;IC=null}
function camUpd(){$('cn').textContent=P[CI].length+' fotos';$('cs').innerHTML=P[CI].slice(-5).map(p=>`<img src="${p.th||p.url}">`).join('')}
async function camClose(){camStop();$('cm').style.display='none';while(pend)await new Promise(r=>setTimeout(r,30));list();runAQ().then(refresh)}
let FAST=true;
function toggleFast(){FAST=!FAST;$('fm').textContent=FAST?'Rápido · 3 MP':'Máx. calidad'}
function flashCam(){$('cm').classList.add('fl');setTimeout(()=>$('cm').classList.remove('fl'),90)}
async function shoot(){if(busy||!ST)return;busy=true;flashCam();if(navigator.vibrate)navigator.vibrate(15);
if(!FAST&&IC){try{const b=await IC.takePhoto(MAXP);addBlob(CI,b);camUpd();busy=false;return}catch(e){}}
const c=grab(),sc=small(c),p={blob:null,url:null,time:new Date().toISOString(),q:[],th:sc.toDataURL('image/jpeg',.7)};P[CI].push(p);NA[CI]=false;camUpd();pend++;busy=false;
c.toBlob(b=>{p.blob=b;p.url=URL.createObjectURL(b);p.q=quality(sc,b.size).issues;pend--},'image/jpeg',.9)}
function editV(){const p=P[V.i][V.j];ED={i:V.i,j:V.j};$('vw').style.display='none';openCrop(p.blob)}
dbGet().then(d=>{DR=d;home()});
</script></body></html>
